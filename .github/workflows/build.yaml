name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        run: brew install qtbase

      - name: Configure
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release
